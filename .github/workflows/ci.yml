name: "CI"

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: "Go 🐹"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 📥 Download dependencies
        run: go mod download

      - name: 🔍 Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🏗️ Build
        run: go build ./...

      - name: 🧪 Run tests
        run: go test -race -cover ./...

  terraform:
    name: "Terraform 🏗️"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 🔍 Terraform Format
        run: terraform fmt -check -recursive

      - name: 📋 Terraform Init
        run: terraform init -backend=false

      - name: 🔍 Terraform Validate
        run: terraform validate

      - name: 🔒 Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: 🔍 Run TFLint
        run: tflint

      - name: 🛡️ Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: gcp

  shell:
    name: "Shell 🐚"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🔍 ShellCheck
        run: |
          shellcheck tools/*.sh && shellcheck gcp/*.sh

  docker:
    name: "Docker 🐳"
    needs: [go, terraform, shell]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Build Docker image
        run: |
          docker build -t bookmarks-manager .

      - name: 🔐 Set permissions for volumes
        run: |
          mkdir -p database
          chmod -R 777 database

      - name: 🚀 Start Docker container
        run: |
          docker run -d -p 8080:8080 \
            -v $(pwd)/database:/var/lib/bookmarks:rw \
            --name bookmarks-manager bookmarks-manager

      - name: ⏳ Wait for container to be ready
        run: |
          # Wait for up to 30 seconds for the service to respond
          for i in {1..30}; do
            if curl -s http://localhost:8080/robots.txt > /dev/null; then
              echo "Container is ready!"
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 1
          done
          echo "Container failed to start in time"
          docker logs bookmarks-manager
          exit 1

      - name: 🔍 Access Container web app via curl
        run: |
          curl -v -u admin:changeme http://localhost:8080/

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop bookmarks-manager || true
          docker rm bookmarks-manager || true
