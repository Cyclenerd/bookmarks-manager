{{ define "content" }}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading"><i class="bi bi-exclamation-triangle"></i> Error {{ .ErrorCode }}</h4>
            <hr>
            <p class="mb-0"><strong>{{ .ErrorName }}:</strong> {{ .ErrorDescription }}</p>
        </div>
        <div class="mt-4">
            <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Go Home</a>
            <button onclick="history.back()" class="btn btn-secondary ms-2"><i class="bi bi-arrow-left"></i> Go Back</button>
        </div>
    </div>
</div>
{{ end }}
