{{ define "content" }}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2 class="mb-4">
            <i class="bi bi-{{ if .Tag }}pencil{{ else }}plus-lg{{ end }}"></i>
            {{ if .Tag }}Edit{{ else }}Add{{ end }} Tag
        </h2>

        <form action="/tag/save" method="post">
            {{ if .ReturnURL }}<input type="hidden" name="return_url" value="{{ .ReturnURL }}">{{ end }}
            {{ if .Tag }}<input type="hidden" name="tag_id" value="{{ .Tag.ID }}">{{ end }}

            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name"
                    value="{{ if .Tag }}{{ .Tag.Name }}{{ end }}" required autofocus>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                <a href="{{ if .ReturnURL }}{{ .ReturnURL }}{{ else }}/{{ end }}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
                {{ if .Tag }}
                <button type="button" class="btn btn-outline-danger ms-auto"
                    onclick="if(confirm('Delete this tag? Bookmarks will not be deleted.')) document.getElementById('deleteForm').submit();">
                    <i class="bi bi-trash"></i> Delete
                </button>
                {{ end }}
            </div>
        </form>

        {{ if .Tag }}
        <form id="deleteForm" action="/tag/{{ .Tag.ID }}/delete" method="post" style="display:none;"></form>
        {{ end }}
    </div>
</div>
{{ end }}
